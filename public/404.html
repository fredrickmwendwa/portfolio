<style>
:root{--bone:#F1EEE8;--paper:#FAF8F4;--sand:#E6E1D6;--ink:#12110F;--graphite:#5A5750;--accent:#2338E6;--ease:cubic-bezier(.2,.7,.2,1);color-scheme:light}
:root[data-theme="dark"]{--bone:#14130F;--paper:#1B1A16;--sand:#25231E;--ink:#F1EEE8;--graphite:#A8A399;--accent:#A3AEFF;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:var(--bone);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}

main{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:clamp(24px,5vw,80px);padding:clamp(24px,5vw,64px) clamp(20px,4.4vw,64px) clamp(48px,7vw,96px);max-width:1360px;width:100%;margin:0 auto}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite)}
.eyebrow i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
h1{margin:22px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(44px,6.4vw,92px);line-height:.96;letter-spacing:-.045em}
h1 span{color:var(--accent)}
p{margin:26px 0 0;max-width:28em;color:var(--graphite);font-size:clamp(17px,1.4vw,20px)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border:1px solid var(--ink);border-radius:999px;font-weight:600;font-size:16px;transition:background .25s var(--ease),color .25s var(--ease),transform .25s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.art{position:relative;justify-self:center;width:min(100%,380px);aspect-ratio:4/5}
.art .back,.art .front{position:absolute;border-radius:999px 999px 0 0}
.art .back{inset:0;transform:translate(24px,24px);background:#2338E6;animation:in 1.1s var(--ease) .5s both}
.art .front{inset:0;background:var(--sand);display:grid;place-items:center;overflow:hidden;animation:wipe 1.2s var(--ease) both}
.art .front b{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(110px,15vw,190px);letter-spacing:-.07em;line-height:1;color:var(--ink);padding-top:18%}
.art .front b em{font-style:normal;color:var(--accent)}
@keyframes wipe{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
@keyframes in{from{opacity:0;transform:translate(0,0)}to{opacity:1;transform:translate(24px,24px)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
main>div:first-child>*{animation:up .8s var(--ease) both}
main>div:first-child>*:nth-child(2){animation-delay:.08s}
main>div:first-child>*:nth-child(3){animation-delay:.16s}
main>div:first-child>*:nth-child(4){animation-delay:.24s}
footer{padding:0 clamp(20px,4.4vw,64px) 28px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite)}
@media (max-width:820px){main{grid-template-columns:1fr}.art{order:-1;width:min(70%,260px);margin-bottom:12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
