<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found | Fredrick Mwendwa</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/favicon.ico" sizes="any" />
<link rel="icon" href="assets/favicon-32x32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.3/index.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.0.3/index.css" />
<link rel="stylesheet" href="css/style.css" />
<script>
try {
  var t = localStorage.getItem('theme');
  if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }
} catch (_e) {}
</script>
</head>
<body>
  <main id="main">
    <div class="container notfound">
      <span class="eyebrow">404</span>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist, or it may have moved. The site is now a single page, everything lives at the homepage.</p>
      <a class="btn btn-primary" href="/">Back to Home
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </div>
  </main>
</body>
</html>
